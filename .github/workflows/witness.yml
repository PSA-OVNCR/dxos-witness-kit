# Witness độc lập cho DX-OS Trust Core (spec 11.4). Chạy 6 giờ một lần khi đã đặt biến repo DXOS_SERVER.
# Lịch sử STH đã kiểm được commit vào thư mục state/ của chính repo này, nên người giữ repo luôn có bằng chứng.
# Biến tùy chọn: DXOS_REF (tag/nhánh của PSA-OVNCR/dxos, mặc định v0.1.0),
#                DXOS_ANCHOR_REPO (mặc định PSA-OVNCR/dxos-transparency-log).
name: witness
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write   # chỉ để commit state/ vào chính repo này

concurrency: { group: witness, cancel-in-progress: false }

jobs:
  sync:
    if: ${{ vars.DXOS_SERVER != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: self }
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DXOS_ANCHOR_REPO || 'PSA-OVNCR/dxos-transparency-log' }}
          path: anchor
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cài dxos-witness
        env:
          REF: ${{ vars.DXOS_REF || 'v0.1.0' }}
        run: |
          python -m pip install \
            "dxos-proof @ git+https://github.com/PSA-OVNCR/dxos@${REF}#subdirectory=libs/dxos-proof" \
            "dxos-witness @ git+https://github.com/PSA-OVNCR/dxos@${REF}#subdirectory=witness"
      - name: Kiểm
        id: sync
        run: |
          set +e
          dxos-witness sync --server "${{ vars.DXOS_SERVER }}" --anchor-dir anchor --state-dir self/state --no-pull
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Lưu state đã kiểm
        working-directory: self
        run: |
          git add state
          git diff --cached --quiet && exit 0
          git -c user.name="dxos-witness" -c user.email="dxos-witness@users.noreply.github.com" \
            commit -q -m "witness: state sau lần kiểm ${{ github.run_id }}"
          git push -q
      - name: Báo kết quả
        if: ${{ steps.sync.outputs.code != '0' }}
        run: |
          echo "::error::dxos-witness trả mã ${{ steps.sync.outputs.code }}: bất thường, giữ nguyên state/ và báo đội DX-OS"
          exit 1
